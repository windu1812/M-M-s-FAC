# Streamlit settings for this project (no secrets here).
[browser]
# Do not send usage statistics to Streamlit.
gatherUsageStats = false

[server]
# Only this laptop can open the app (not other devices on the same network).
address = "localhost"

[client]
# No Deploy button, no developer menu (rerun, clear cache, record a screencast): the page shows only CreditLens.
toolbarMode = "minimal"

[theme]
# docs/product.md: "a bank credit sheet, sober, with a white background", here in the clean style of a product
# page: white page, light grey tiles, near-black text, one blue accent. Without "light" the page would follow the
# dark mode of the computer.
base = "light"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
borderColor = "#d2d2d7"
dataframeHeaderBackgroundColor = "#f5f5f7"
# One blue for buttons and selectors: on the page, red, orange and green mean flags only.
primaryColor = "#0071e3"
baseRadius = "0.75rem"
buttonRadius = "full"  # pill-shaped buttons
# A compact top of page, so the summary cards fit on the first screen of a laptop (default 6rem).
paddingTop = "1rem"
headingFontSizes = ["2.4rem", "1.5rem", "1.15rem"]
headingFontWeights = [600, 600, 600]
